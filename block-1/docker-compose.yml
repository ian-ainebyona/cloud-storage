services:
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: garage-storage-lab
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3903:3903"
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data
